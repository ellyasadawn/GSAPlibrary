<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marquee banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #cbaaf6;
    display: flex; align-items: center;
    font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .marquee {
    display: flex;
    align-items: center;
    will-change: transform;
    flex-shrink: 0;
  }
  .marquee__track {
    display: flex;
    align-items: center;
    gap: 3vw;
    padding-right: 3vw;
    flex-shrink: 0;
  }
  .marquee__word {
    font-size: clamp(34px, 65vh, 130px);
    font-weight: 800;
    color: #3d1a6f;
    letter-spacing: -0.025em;
    text-transform: uppercase;
    line-height: 1;
    flex-shrink: 0;
    /* slight vertical optical nudge so descender-less caps sit center */
    transform: translateY(-0.04em);
  }
  .marquee__star {
    width: clamp(22px, 35vh, 64px);
    height: clamp(22px, 35vh, 64px);
    fill: #3d1a6f;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="marquee" id="marquee">
    <!-- Each track has 6 word+star pairs so a single track is reliably wider
         than the viewport at any tile size. Two tracks duplicated so the
         loop at xPercent:-50 lands on a pixel-identical position. -->
    <div class="marquee__track">
      <span class="marquee__word">Design</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <span class="marquee__word">Motion</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <span class="marquee__word">Craft</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <span class="marquee__word">Story</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <span class="marquee__word">Brand</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <span class="marquee__word">Studio</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
    </div>
    <div class="marquee__track" aria-hidden="true">
      <span class="marquee__word">Design</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <span class="marquee__word">Motion</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <span class="marquee__word">Craft</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <span class="marquee__word">Story</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <span class="marquee__word">Brand</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <span class="marquee__word">Studio</span>
      <svg class="marquee__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    gsap.to("#marquee", {
      xPercent: -50,
      duration: 28,
      ease: "none",
      repeat: -1,
    });
  </script>
</body>
</html>
