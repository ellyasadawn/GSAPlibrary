<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card tilt hover</title>
<style>
  html, body {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #f4f1ee, #e8e2dc);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .scene { perspective: 700px; width: 62%; aspect-ratio: 1.2 / 1; }
  .card {
    width: 100%; height: 100%;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.12);
    transform-style: preserve-3d;
    will-change: transform;
    display: flex; align-items: center; justify-content: center;
    color: #ccc; font-size: 13px;
  }
</style>
</head>
<body>
  <div class="scene"><div class="card" id="card">card</div></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const card = document.getElementById("card");

    // Self-demo: cycle through four corners with a brief rest at center.
    // Larger tilt angles so motion reads clearly inside a small tile.
    const positions = [
      { rotX:  18, rotY: -28 },
      { rotX:  18, rotY:  28 },
      { rotX: -18, rotY:  28 },
      { rotX: -18, rotY: -28 },
      { rotX:   0, rotY:   0 },
    ];

    const tl = gsap.timeline({ repeat: -1, defaults: { duration: 0.75, ease: "power2.out" } });
    positions.forEach(p => {
      tl.to(card, { rotationX: p.rotX, rotationY: p.rotY })
        .to({}, { duration: 0.55 });  // hold
    });
  </script>
</body>
</html>
