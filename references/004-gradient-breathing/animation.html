<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gradient breathing</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    background: linear-gradient(135deg, #ff7eb6 0%, #b56cf2 50%, #5fa8fb 100%);
    background-size: 220% 220%;
    will-change: background-position, filter;
  }
</style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    // Ambient continuous effect: gradient position drifts + hue rotates.
    // Faster cycles and saturated colors so the motion is obvious at a glance.
    gsap.to(document.body, {
      backgroundPosition: "100% 100%",
      duration: 3.5,
      ease: "sine.inOut",
      repeat: -1,
      yoyo: true,
    });

    gsap.to(document.body, {
      filter: "hue-rotate(140deg)",
      duration: 5.5,
      ease: "sine.inOut",
      repeat: -1,
      yoyo: true,
    });
  </script>
</body>
</html>
