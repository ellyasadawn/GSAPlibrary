<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magnetic button</title>
<style>
  html, body {
    margin: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #e8f0ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .btn {
    background: #111; color: #fff;
    padding: 14px 32px;
    border-radius: 999px;
    font-size: 14px; font-weight: 500;
    will-change: transform;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="btn" id="btn">Click me</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const btn = document.getElementById("btn");

    // Self-demo: simulate a cursor approaching from each corner, pulling the
    // button toward it, then releasing. Bigger pull + slight scale so the
    // magnetism reads clearly in a small tile.
    const offsets = [
      { x:  38, y: -20, s: 1.06 },
      { x: -38, y: -20, s: 1.06 },
      { x: -38, y:  20, s: 1.06 },
      { x:  38, y:  20, s: 1.06 },
      { x:   0, y:   0, s: 1.00 },
    ];

    const tl = gsap.timeline({ repeat: -1, defaults: { ease: "power3.out" } });
    offsets.forEach(o => {
      tl.to(btn, { x: o.x, y: o.y, scale: o.s, duration: 0.55 })
        .to({}, { duration: 0.55 });
    });
  </script>
</body>
</html>
